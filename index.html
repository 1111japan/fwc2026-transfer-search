<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FWC2026 アイテム移行条件サーチ</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#1b2430;--sub:#5d6b7a;--line:#d9e0e6;--accent:#0f6e8c;--mark:#ffe58a;
--ok:#1f8a4c;--no:#c0392b;--cond:#b7791f;--rep:#2f5fc4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--panel:#18212a;--ink:#e6edf3;--sub:#93a1b0;--line:#2a3743;--accent:#58b8d6;--mark:#6b5a12;--ok:#4cc380;--no:#ff7b6b;--cond:#e8b04a;--rep:#7ea4ff}}
:root[data-theme="dark"]{--bg:#10161c;--panel:#18212a;--ink:#e6edf3;--sub:#93a1b0;--line:#2a3743;--accent:#58b8d6;--mark:#6b5a12;--ok:#4cc380;--no:#ff7b6b;--cond:#e8b04a;--rep:#7ea4ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
[hidden]{display:none!important}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.01em;word-break:auto-phrase;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--sub);font-size:13.5px}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:8px 0 10px}
input{width:100%;font:inherit;font-size:17px;padding:13px 16px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);outline:none}
input:focus{border-color:var(--accent)}
.count{margin:8px 2px 0;font-size:13px;color:var(--sub);min-height:20px}
.row{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px 14px;margin:8px 0}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.name{font-weight:700;font-size:16px;word-break:break-word}
.lv{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:0 8px;white-space:nowrap}
.dup{font-size:12px;color:var(--sub)}
.jp{margin-top:1px;color:var(--ink);font-size:14.5px;word-break:break-word}
.jp+.jp{color:var(--sub);font-size:13px}
.cond{margin-top:2px;color:var(--c);font-weight:600;font-size:14px}
.ok{--c:var(--ok)}.no{--c:var(--no)}.cd{--c:var(--cond)}.rp{--c:var(--rep)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
#more{font:inherit;display:block;margin:14px auto 0;padding:10px 22px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:inherit;font-size:13px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--c,var(--accent));background:var(--panel);color:var(--ink);cursor:pointer}
.chip b{font-weight:400;opacity:.7;margin-left:5px}
.chip.z{opacity:.45}
.chip[aria-pressed=true]{background:var(--c,var(--accent));color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
.legend div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.legend div:last-child{border:0}
.legend span:first-child{color:var(--c);font-weight:600}
.legend span:last-child{color:var(--sub);white-space:nowrap}
.empty{padding:24px 4px;color:var(--sub)}
.lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px}
.note{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;line-height:1.7}
.credit{margin:8px 0 0;color:var(--sub);font-size:12.5px;line-height:1.7}
@media (max-width:640px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}.chip{flex:none;white-space:nowrap}}
</style>
</head>

<div id="out"></div>
<button id="more" hidden>さらに表示</button>
<p class="note" id="note"></p>
<p class="credit" id="credit"></p>
</main>

{ja:"移行されません。",en:"No transfer.",cls:"no"},
{ja:"期間限定でない場合に移行されます。",en:"If not time limited.",cls:"cd"},
{ja:"FWCサーバー終了時に、インベントリの装備ビューで装備している場合に移行されます。",en:"If equipped in the inventory equipment view when the FWC server closes.",cls:"cd"},
{ja:"移行されますが、移行先サーバーに基づく同等のアイテムに置き換わります。",en:"Will be transferred but to the equivalent item based on the target server.",cls:"rp"},
{ja:"中に、移行されるアイテムが1つ以上入っている場合に移行されます。",en:"If it contains at least one item that will be transferred.",cls:"cd"}];
var T={
ja:{title:"FWC2026 アイテム移行条件サーチ",lead:"アイテム名を日本語または英語で入力すると、移行条件が日本語で表示されます(部分一致・複数語はAND検索)。",ph:"例: ラッキーボックス / Scroll of Amplification",
hit:function(n){return n.toLocaleString()+"件ヒット"},none:"一致するアイテムがありません。短いキーワードや、英語名でも試してください。",nof:"この絞り込みに一致するアイテムはありません。",
more:function(n){return "さらに表示("+n.toLocaleString()+"件)"},dup:function(n){return "同一の行が"+n+"件"},leg:"移行条件は次の6種類です(件数は元リストの行数)。",unit:"件",
f:["すべて","常に移行","期間限定でなければ","装備ビューで装備","置き換わり","移行されない","中身次第"]},
en:{title:"FWC2026 Item Transfer Search",lead:"Type an item name in English or Japanese to see its transfer condition (partial match; multiple words = AND).",ph:"e.g. Scroll of Amplification / ラッキーボックス",
hit:function(n){return n.toLocaleString()+(n===1?" result":" results")},none:"No matching items. Try a shorter spelling.",nof:"No items match this filter.",
more:function(n){return "Show more ("+n.toLocaleString()+")"},dup:function(n){return "Identical row x"+n},leg:"There are 6 transfer conditions (counts are rows in the source list).",unit:" rows",
f:["All","Always","If not time limited","If equipped","Replaced","No transfer","Depends on contents"]}};
var CREDIT={ja:"制作: 1111japan（じぇーぴー） © 2026 1111japan",en:"Created by 1111japan (read as “jp”) © 2026 1111japan"};
var NOTE={
ja:"非公式のファンツールです。ゲームの運営会社とは関係ありません。移行条件の日本語は参考用の訳で、誤りがある可能性があります。必ず英語表記の原文をご確認ください。アイテムの日本語名は日本語版ゲームデータとの英語名照合で付与しており、一部のアイテム(「Ultimate」付きの武器など)は日本語名がなく英語名のみ表示されます。出典: FWC2026 Item Transfer List（FU_FWC2026_ItemTransferList.pdf）",
en:"Unofficial fan-made tool, not affiliated with the game's publisher. The Japanese condition text is a reference translation and may contain errors; please check the original English text. Japanese item names are matched from the Japanese game data by English name; a few items (e.g. weapons prefixed with \"Ultimate\") have no Japanese name and show English only. Source: FWC2026 Item Transfer List (FU_FWC2026_ItemTransferList.pdf)"};
var FL=[{f:-1,c:''},{f:0,c:'ok'},{f:2,c:'cd'},{f:3,c:'cd'},{f:4,c:'rp'},{f:1,c:'no'},{f:5,c:'cd'}];
var DATA=JSON.parse(document.getElementById('d').textContent);
function fold(x){return x.toLowerCase().replace(/[\u3041-\u3096]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+96)})}
function nj(x){return fold(x.normalize('NFKC')).replace(/[\s\u30fb\uff65]/g,'')}
var LOW=DATA.map(function(r){return r[0].toLowerCase()});
var LJP=DATA.map(function(r){return r.length>4?r.slice(4).map(nj).join('\n'):''});
var q=document.getElementById('q'),out=document.getElementById('out'),cnt=document.getElementById('count'),more=document.getElementById('more'),chipsEl=document.getElementById('chips'),langEl=document.getElementById('lang');
var hits=[],shown=0,hitRows=0,shownRows=0,re=null,reJ=null,PAGE=100,FIL=-1,L,tm;
try{L=localStorage.getItem('lang')}catch(e){}
if(L!=='ja'&&L!=='en')L=/^ja/i.test(navigator.language||'')?'ja':'en';
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hl(s){if(!re)return esc(s);var o='',last=0,m;re.lastIndex=0;while((m=re.exec(s))&&m[0]){o+=esc(s.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';last=m.index+m[0].length}return o+esc(s.slice(last))}
function hlj(s){if(!reJ)return esc(s);var f=s.toLowerCase().replace(/[\u3041-\u3096]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+96)}),o='',last=0,m;reJ.lastIndex=0;while((m=reJ.exec(f))&&m[0]){o+=esc(s.slice(last,m.index))+'<mark>'+esc(s.slice(m.index,m.index+m[0].length))+'</mark>';last=m.index+m[0].length}return o+esc(s.slice(last))}
function rowHtml(i){var r=DATA[i],c=COND[r[2]];
return '<div class="row '+c.cls+'"><div class="top"><span class="name">'+hl(r[0])+'</span><span class="lv">Lv.'+r[1]+'</span>'+(r[3]>1?'<span class="dup">'+T[L].dup(r[3])+'</span>':'')+'</div>'+r.slice(4).map(function(x){return '<div class="jp">'+hlj(x)+'</div>'}).join('')+'<div class="cond">'+c[L]+'</div></div>'}
function legend(){var n=COND.map(function(){return 0});DATA.forEach(function(r){n[r[2]]+=r[3]});
var h='<div class="empty">'+T[L].leg+'</div><div class="legend">';
COND.forEach(function(c,i){h+='<div class="'+c.cls+'"><span>'+c[L]+'</span><span>'+n[i].toLocaleString()+(L==='en'&&n[i]===1?' row':T[L].unit)+'</span></div>'});
return h+'</div>'}
function renderMore(){var end=Math.min(shown+PAGE,hits.length),h='';for(var i=shown;i<end;i++){h+=rowHtml(hits[i]);shownRows+=DATA[hits[i]][3]}
out.insertAdjacentHTML('beforeend',h);shown=end;more.hidden=shown>=hits.length;more.textContent=T[L].more(hitRows-shownRows)}
function drawChips(nn,total){chipsEl.innerHTML=FL.map(function(x,k){var n=nn?(x.f<0?total:nn[x.f]):null;return '<button class="chip '+x.c+(n===0?' z':'')+'" data-f="'+x.f+'" aria-pressed="'+(FIL===x.f)+'">'+T[L].f[k]+(n===null?'':'<b>'+n.toLocaleString()+'</b>')+'</button>'}).join('')}
function run(){var raw=q.value.normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ');out.innerHTML='';hits=[];shown=0;re=null;reJ=null;more.hidden=true;
if(!raw&&FIL<0){cnt.textContent='';out.innerHTML=legend();drawChips(null);return}
var t=raw?raw.split(' '):[];
var tj=t.map(nj);
re=!t.length?null:new RegExp('('+t.map(function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}).join('|')+')','gi');
reJ=!t.length?null:new RegExp('('+t.map(function(x){var k=Array.from(nj(x)).map(function(c){return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')});return k.join('[\\u30fb\\s]*')}).join('|')+')','g');
var sc=[];
var rj=nj(raw);
for(var i=0;i<LOW.length;i++){var s=LOW[i],sj=LJP[i],ok=true;for(var j=0;j<t.length;j++){if(s.indexOf(t[j])<0&&sj.indexOf(tj[j])<0){ok=false;break}}
if(ok){var k=(s===raw||sj.split('\n').indexOf(rj)>=0)?0:((s.indexOf(raw)===0||(rj&&sj.indexOf(rj)===0))?1:((s.indexOf(raw)>0||(rj&&sj.indexOf(rj)>0))?2:3));sc.push([k,i])}}
sc.sort(function(a,b){return a[0]-b[0]||a[1]-b[1]});
var nn=[0,0,0,0,0,0],tw=0;sc.forEach(function(x){var w=DATA[x[1]][3];nn[DATA[x[1]][2]]+=w;tw+=w});drawChips(nn,tw);
hits=sc.map(function(x){return x[1]}).filter(function(i){return FIL<0||DATA[i][2]===FIL});
if(!hits.length){cnt.textContent=T[L].hit(0);out.innerHTML='<div class="empty">'+(sc.length?T[L].nof:T[L].none)+'</div>';return}
hitRows=hits.reduce(function(a,i){return a+DATA[i][3]},0);shownRows=0;cnt.textContent=T[L].hit(hitRows);renderMore()}
function applyLang(){document.documentElement.lang=L;document.title=T[L].title;
document.getElementById('ttl').textContent=T[L].title;document.getElementById('lead').textContent=T[L].lead;
q.placeholder=T[L].ph;document.getElementById('note').textContent=NOTE[L];document.getElementById('credit').textContent=CREDIT[L];q.setAttribute('aria-label',T[L].title);
langEl.innerHTML=['ja','en'].map(function(l){return '<button class="chip" data-l="'+l+'" aria-pressed="'+(L===l)+'">'+(l==='ja'?'日本語':'English')+'</button>'}).join('');
run()}
langEl.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(x){}applyLang();var nb=langEl.querySelector('[data-l="'+L+'"]');if(nb)nb.focus()});
chipsEl.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;FIL=+b.dataset.f;run();var nb=chipsEl.querySelector('[data-f="'+FIL+'"]');if(nb)nb.focus()});
q.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(run,120)});
more.addEventListener('click',renderMore);
applyLang();
</script>
</body>
</html>
